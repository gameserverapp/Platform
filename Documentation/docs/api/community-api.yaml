openapi: 3.0.0
info:
  title: 'Community API'
  description: "External sources can tap into the Community website API to retrieve data about online players and much more.\n\nThe OAuth API automatically redirects users to authenticate with Steam. This lets GameServerApp verify in-game players on the website, enabling features like in-game purchases and direct messaging.\n\n## API key\nFind the OAuth API keys & redirect URL here: https://dash.gameserverapp.com/configure/api/community-api \\\n⚠️ OAuth API keys are sensitive information. Do not share them with anyone.\n\n## Request headers\nAll requests require to have one the following HTTP headers, except for MOD api calls:\n\n```composer log\nX-AUTH-GSA-CLIENT-ID: {your Client ID}\nAuthorization: Bearer {refresh_token}\n```\n\n## OpenAPI file for AI\nWhen using AI tools, use the [OpenAPI file](https://api.gameserverapp.com/.well-known/community-api.yaml) to make it understand the Community API.\n\n## Libraries\nYou can find the [Official PHP API wrapper on GitHub](https://github.com/GameserverApp/PHP-API-Wrapper)."
  contact:
    email: support@gameserverapp.com
  version: '1'
servers:
  -
    url: 'https://api.gameserverapp.com'
    description: api.gameserverapp.com
paths:
  /api/v1/calendar-feed:
    get:
      tags:
        - Calendar
      summary: 'Get calendar feed'
      description: 'Retrieve calendar events within a specified date range for feed views'
      operationId: getCalendarFeed
      parameters:
        -
          name: start
          in: query
          description: 'Start date filter'
          required: true
          schema:
            type: string
            format: date
          example: '2026-10-01'
        -
          name: end
          in: query
          description: 'End date filter'
          required: true
          schema:
            type: string
            format: date
          example: '2026-10-31'
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/calendar/{id}':
    get:
      tags:
        - Calendar
      summary: 'Get calendar event'
      description: 'Retrieve details of a specific calendar event'
      operationId: getCalendarEvent
      parameters:
        -
          name: id
          in: path
          description: 'Calendar event ID'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/calendar/{id}/related':
    get:
      tags:
        - Calendar
      summary: 'Get related calendar events'
      description: 'Retrieve upcoming related calendar events'
      operationId: getRelatedCalendarEvents
      parameters:
        -
          name: id
          in: path
          description: 'Calendar event ID to exclude'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/calendar/{id}/participate':
    post:
      tags:
        - Calendar
      summary: 'Toggle event participation'
      description: 'Subscribe or unsubscribe the authenticated user to/from a calendar event'
      operationId: participateInCalendarEvent
      parameters:
        -
          name: id
          in: path
          description: 'Calendar event ID'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
      security:
        -
          community-passport: []
  '/api/v1/character/{uuid}':
    get:
      tags:
        - Character
      summary: 'Get character'
      description: 'Retrieve details for a specific character by UUID'
      operationId: getCharacter
      parameters:
        -
          name: uuid
          in: path
          description: 'Character UUID'
          required: true
          schema:
            type: string
          example: 083e2257-c7d6-444d-ac17-e5334ede9b27
      responses:
        '200':
          description: 'successful operation'
  /api/v1/characters/top:
    get:
      tags:
        - Character
      summary: 'Get top characters'
      description: 'Retrieve top 5 characters across active game servers'
      operationId: getTopCharacters
      responses:
        '200':
          description: 'successful operation'
  /api/v1/characters/fresh:
    get:
      tags:
        - Character
      summary: 'Get fresh characters'
      description: 'Retrieve 5 recently created characters across active game servers'
      operationId: getFreshCharacters
      responses:
        '200':
          description: 'successful operation'
  /api/v1/characters/online:
    get:
      tags:
        - Character
      summary: 'Get online characters'
      description: 'Retrieve online characters and total online count across active game servers'
      operationId: getOnlineCharacters
      responses:
        '200':
          description: 'successful operation'
  /api/v1/characters/spotlight:
    get:
      tags:
        - Character
      summary: 'Get spotlight characters'
      description: 'Retrieve random spotlight characters across active game servers'
      operationId: getSpotlightCharacters
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/character/{uuid}/stats/{type}':
    get:
      tags:
        - Character
      summary: 'Get character statistics'
      description: 'Retrieve statistical chart data for a specific character by type'
      operationId: getCharacterStats
      parameters:
        -
          name: uuid
          in: path
          description: 'Character UUID'
          required: true
          schema:
            type: string
          example: 083e2257-c7d6-444d-ac17-e5334ede9b27
        -
          name: type
          in: path
          description: 'Statistic type'
          required: true
          schema:
            type: string
            enum:
              - hours-played
              - levels-gained
              - xp-gained
          example: hours-played
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/character/{uuid}/about':
    post:
      tags:
        - Character
      summary: 'Update character about information'
      description: 'Update about text and optional image for a character belonging to the authenticated user'
      operationId: updateCharacterAbout
      parameters:
        -
          name: uuid
          in: path
          description: 'Character UUID'
          required: true
          schema:
            type: string
          example: 083e2257-c7d6-444d-ac17-e5334ede9b27
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              required:
                - about
              properties:
                about:
                  description: 'About text for the character'
                  type: string
                  maxLength: 1000
                  example: 'Veteran survivor of the ARK.'
                file:
                  description: 'Optional image upload'
                  type: string
                  format: binary
              type: object
      responses:
        '200':
          description: 'successful operation'
      security:
        -
          community-passport: []
  '/api/v1/cluster/{id}/stats/{type}':
    get:
      tags:
        - Cluster
      summary: 'Get cluster statistics'
      description: 'Retrieve statistics and metrics for a specific cluster by type'
      operationId: getClusterStats
      parameters:
        -
          name: id
          in: path
          description: 'Cluster ID'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: type
          in: path
          description: 'Statistic type'
          required: true
          schema:
            type: string
            enum:
              - active-tribes
              - newbies
              - top-players
              - last-online
              - online-count-last-7-days
              - hours-played-last-7-days
              - new-players-last-7-days
          example: active-tribes
      responses:
        '200':
          description: 'successful operation'
  /api/v1/domain/settings:
    get:
      tags:
        - Domain
      summary: 'Get domain settings'
      description: 'Retrieve public configuration, theme settings, features, routes, and custom menu for the current domain'
      operationId: getDomainSettings
      responses:
        '200':
          description: 'successful operation'
        '404':
          description: 'Domain not found'
  '/api/v1/domain/stats/{type}':
    get:
      tags:
        - Domain
      summary: 'Get domain statistics'
      description: 'Retrieve statistical data and charts for the domain by type'
      operationId: getDomainStats
      parameters:
        -
          name: type
          in: path
          description: 'Statistic type'
          required: true
          schema:
            type: string
            enum:
              - hours-played
              - online-players
              - new-characters
              - active-tribes
              - newbies
              - top-players
              - last-online
              - online-count-last-7-days
              - hours-played-last-7-days
              - new-players-last-7-days
          example: online-players
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Bad request'
  '/api/v1/form/{form_id}':
    post:
      tags:
        - Form
      summary: 'Submit form or application'
      description: 'Submit a custom form or application by form ID or form identifier'
      operationId: submitForm
      parameters:
        -
          name: form_id
          in: path
          description: 'Form ID (integer) or application form identifier (string)'
          required: true
          schema:
            type: string
          example: '1'
      requestBody:
        description: 'Form field key-value submission data'
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              field_1: 'John Doe'
              field_2: 'I would like to apply'
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Bad request or validation error'
      security:
        -
          community-passport: []
  /api/v1/messages/inbox:
    get:
      tags:
        - Message
      summary: 'Get inbox messages'
      description: 'Retrieve paginated inbox messages for the authenticated user'
      operationId: getInboxMessages
      responses:
        '200':
          description: 'successful operation'
      security:
        -
          community-passport: []
  /api/v1/messages/outbox:
    get:
      tags:
        - Message
      summary: 'Get outbox messages'
      description: 'Retrieve paginated sent messages for the authenticated user'
      operationId: getOutboxMessages
      responses:
        '200':
          description: 'successful operation'
      security:
        -
          community-passport: []
  '/api/v1/message/{uuid}':
    get:
      tags:
        - Message
      summary: 'Get message details'
      description: 'Retrieve a specific message by UUID and mark it as read if the recipient is viewing'
      operationId: getMessage
      parameters:
        -
          name: uuid
          in: path
          description: 'Message UUID'
          required: true
          schema:
            type: string
          example: 083e2257-c7d6-444d-ac17-e5334ede9b27
      responses:
        '200':
          description: 'successful operation'
        '404':
          description: 'Message not found'
      security:
        -
          community-passport: []
  '/api/v1/message/send/{uuid}':
    post:
      tags:
        - Message
      summary: 'Send direct message'
      description: 'Send a direct message to a user by receiver UUID'
      operationId: sendMessage
      parameters:
        -
          name: uuid
          in: path
          description: 'Receiver user UUID'
          required: true
          schema:
            type: string
          example: 083e2257-c7d6-444d-ac17-e5334ede9b27
      requestBody:
        description: 'Message subject and content'
        required: true
        content:
          application/json:
            schema:
              required:
                - subject
                - content
              properties:
                subject:
                  type: string
                  maxLength: 255
                  minLength: 8
                  example: 'Tribe Recruitment Offer'
                content:
                  type: string
                  minLength: 8
                  example: 'Hello! We would like to invite you to join our tribe on the server.'
              type: object
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Bad request, validation error, or banned user'
        '429':
          description: 'Hourly message rate limit reached'
      security:
        -
          community-passport: []
  /api/v1/messages/contacts:
    get:
      tags:
        - Message
      summary: 'Get message contacts'
      description: 'Retrieve recent contacts/conversation partners for the authenticated user'
      operationId: getMessageContacts
      responses:
        '200':
          description: 'successful operation'
      security:
        -
          community-passport: []
  /api/v1/news:
    get:
      tags:
        - News
      summary: 'Get published news articles'
      description: 'Retrieve paginated list of published news articles for the current domain'
      operationId: getNewsArticles
      parameters:
        -
          name: page
          in: query
          description: 'Page number for pagination'
          required: false
          schema:
            type: integer
          example: 1
        -
          name: skip_latest
          in: query
          description: 'Flag to exclude the latest news articles from the results'
          required: false
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  /api/v1/news/latest:
    get:
      tags:
        - News
      summary: 'Get latest news articles'
      description: 'Retrieve latest published news articles for the current domain'
      operationId: getLatestNewsArticles
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/news/{id}/related':
    get:
      tags:
        - News
      summary: 'Get related news articles'
      description: 'Retrieve related latest published news articles excluding the specified article ID'
      operationId: getRelatedNewsArticles
      parameters:
        -
          name: id
          in: path
          description: 'News article ID to exclude'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/news/{id}':
    get:
      tags:
        - News
      summary: 'Get news article'
      description: 'Retrieve details of a published news article by ID for the current domain'
      operationId: getNewsArticle
      parameters:
        -
          name: id
          in: path
          description: 'News article ID'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
        '404':
          description: 'Article not found'
  '/api/v1/page/{id}':
    get:
      tags:
        - Page
      summary: 'Get published page'
      description: 'Retrieve details and content of a published page by ID or slug for the current domain'
      operationId: getPage
      parameters:
        -
          name: id
          in: path
          description: 'Page ID or slug'
          required: true
          schema:
            type: string
          example: '1'
      responses:
        '200':
          description: 'successful operation'
        '404':
          description: 'Page not found'
  /api/v1/report:
    post:
      tags:
        - Report
      summary: 'Submit report'
      description: 'Submit a player or general issue report to community administrators'
      operationId: submitReport
      requestBody:
        description: 'Report details including type, comment, and optional reported character UUID'
        required: true
        content:
          application/json:
            schema:
              required:
                - type
                - comment
              properties:
                type:
                  description: 'Report category or issue type'
                  type: string
                  example: player_report
                comment:
                  description: 'Detailed description of the issue'
                  type: string
                  example: 'Player was using abusive language in chat'
                reporting_char:
                  description: 'UUID of the character being reported'
                  type: string
                  example: 083e2257-c7d6-444d-ac17-e5334ede9b27
                  nullable: true
              type: object
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Bad request, validation error, or banned user'
        '401':
          description: Unauthenticated
        '404':
          description: 'Character not found'
        '429':
          description: 'Rate limit cooldown exceeded'
      security:
        -
          community-passport: []
  /api/v1/reviews/carousel:
    get:
      tags:
        - Review
      summary: 'Get reviews carousel'
      description: 'Retrieve recent reviews for the domain carousel display'
      operationId: getReviewsCarousel
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Review data is disabled'
  /api/v1/reviews/summary:
    get:
      tags:
        - Review
      summary: 'Get AI review summary'
      description: 'Retrieve AI-generated summary of reviews for the current domain'
      operationId: getReviewsAiSummary
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Review data is disabled'
  '/api/v1/sale/stats/{type}':
    get:
      tags:
        - Sale
      summary: 'Get sales statistics'
      description: 'Retrieve sales statistics such as the last 5 donors or monthly target progress for the current domain'
      operationId: getSaleStats
      parameters:
        -
          name: type
          in: path
          description: 'Statistic type'
          required: true
          schema:
            type: string
            enum:
              - last-5
              - monthly-target
          example: last-5
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Bad request or sales data is disabled'
  /api/v1/search:
    get:
      tags:
        - Search
      summary: 'Search characters or tribes'
      description: 'Search for characters or tribes across gameservers for the current domain with optional filters'
      operationId: search
      parameters:
        -
          name: search_type
          in: query
          description: 'Type of entity to search: character or tribe'
          required: false
          schema:
            type: string
            default: character
            enum:
              - character
              - tribe
          example: character
        -
          name: search
          in: query
          description: 'Search term matching character or tribe name'
          required: false
          schema:
            type: string
          example: Survivor
        -
          name: gender-m
          in: query
          description: 'Filter for male characters (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: gender-f
          in: query
          description: 'Filter for female characters (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: has_tribe-y
          in: query
          description: 'Filter for characters associated with a tribe (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: has_tribe-n
          in: query
          description: 'Filter for characters not associated with a tribe (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: only_online
          in: query
          description: 'Filter for characters currently online (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: only_donators
          in: query
          description: 'Filter for characters belonging to donating users (1 = true)'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
        -
          name: order_by
          in: query
          description: 'Field to order results by'
          required: false
          schema:
            type: string
            default: name
            enum:
              - activity
              - level
              - created
              - name
          example: name
        -
          name: order
          in: query
          description: 'Sort direction (asc or desc)'
          required: false
          schema:
            type: string
            default: asc
            enum:
              - asc
              - desc
          example: asc
        -
          name: page
          in: query
          description: 'Page number for pagination'
          required: false
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  /api/v1/servers:
    get:
      tags:
        - Server
      summary: 'Get all gameservers'
      description: 'Retrieve all active frontend gameservers for the current domain'
      operationId: getServers
      parameters:
        -
          name: status
          in: query
          description: 'Include live server status info'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/server/{id}':
    get:
      tags:
        - Server
      summary: 'Get gameserver details'
      description: 'Retrieve details for a specific gameserver by ID for the current domain'
      operationId: getServer
      parameters:
        -
          name: id
          in: path
          description: 'Gameserver ID'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: mods
          in: query
          description: 'Include mod information'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
          example: 1
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Invalid server ID'
  '/api/v1/server/{id}/claim-vote':
    post:
      tags:
        - Server
      summary: 'Claim vote reward'
      description: 'Claim voting reward for the authenticated user on the specified gameserver'
      operationId: claimServerVote
      parameters:
        -
          name: id
          in: path
          description: 'Gameserver ID'
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Invalid server ID or vote claim rate limit cooldown'
        '401':
          description: Unauthenticated
      security:
        -
          community-passport: []
  '/api/v1/server/{id}/stats/{type}':
    get:
      tags:
        - Server
      summary: 'Get gameserver statistics'
      description: 'Retrieve statistics for a specific gameserver such as active tribes, top players, online count, or hours played'
      operationId: getServerStats
      parameters:
        -
          name: id
          in: path
          description: 'Gameserver ID'
          required: true
          schema:
            type: integer
          example: 1
        -
          name: type
          in: path
          description: 'Statistic type'
          required: true
          schema:
            type: string
            enum:
              - active-tribes
              - newbies
              - top-players
              - last-online
              - online-count-last-7-days
              - hours-played-last-7-days
              - new-players-last-7-days
          example: active-tribes
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Invalid request'
        '404':
          description: 'Gameserver not found'
  '/api/v1/servers/mod-list/{value}':
    get:
      tags:
        - Server
      summary: 'Get server mod list'
      description: 'Retrieve installed plugins/mods for gameservers using an encrypted token'
      operationId: getServerModList
      parameters:
        -
          name: value
          in: path
          description: 'Encrypted token'
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 'successful operation'
        '400':
          description: 'Invalid token, domain mismatch, invalid framework, or invalid game'
  /api/v1/shop:
    get:
      tags:
        - Shop
      summary: 'Get shop packs'
      description: 'Retrieve available shop packs for the current domain with optional search, cluster, gameserver, and category filters'
      operationId: getShopPacks
      parameters:
        -
          name: cluster
          in: query
          description: 'Filter shop packs by cluster UUID'
          required: false
          schema:
            type: string
            format: uuid
          example: 123e4567-e89b-12d3-a456-426614174000
        -
          name: gameserver
          in: query
          description: 'Filter shop packs by gameserver ID'
          required: false
          schema:
            type: integer
          example: 1
        -
          name: filter
          in: query
          description: 'Filter shop packs by category label or tag'
          required: false
          schema:
            type: string
          example: weapons
        -
          name: search
          in: query
          description: 'Search shop packs by title or description'
          required: false
          schema:
            type: string
          example: 'starter pack'
        -
          name: page
          in: query
          description: 'Page number for pagination'
          required: false
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: 'successful operation'
  '/api/v1/shop/{id}':
    get:
      tags:
        - Shop
      summary: 'Get shop pack details'
      description: 'Retrieve details for a specific shop pack by UUID for the current domain'
      operationId: getShopPack
      parameters:
        -
          name: id
          in: path
          description: 'Shop pack UUID'
          required: true
          schema:
            type: string
          example: 123e4567-e89b-12d3-a456-426614174000
      responses:
        '200':
          description: 'successful operation'
        '404':
          description: 'Pack not found'
  '/api/v1/shop/{id}/purchase':
    post:
      tags:
        - Shop
      summary: 'Purchase shop pack'
      description: 'Purchase a shop pack for the authenticated user with optional character, gameserver, and quantity specifications'
      operationId: purchaseShopPack
      parameters:
        -
          name: id
          in: path
          description: 'Shop pack UUID'
          required: true
          schema:
            type: string
          example: 123e4567-e89b-12d3-a456-426614174000
